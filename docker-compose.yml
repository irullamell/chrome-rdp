services:
  browser:
    build:
      context: .
      args:
        WITH_WEB: "1"
        WITH_CJK_FONTS: "1"
        SAVE_BANDWIDTH: "1"
        RDP_MAX_BPP: "24"
        RDP_PAM: "0"      # "1" = kembali ke mode login password
    image: railway-chromium-browser
    container_name: chromium-browser
    ports:
      - "3389:3389"   # RDP
      - "8080:8080"   # Web / noVNC
    # Tanpa password: tidak ada BROWSER_PASSWORD / RDP_PASSWORD sama sekali.
    environment:
      # ACCESS_TOKEN: rahasia123   # opsional, kunci akses web
      # AUTH_PROXY: user:pass@host:port   # opsional, proxy ber-bayar
      HTTP_PORT: "8080"
      RDP_PORT: "3389"
      SCREEN: 1600x900x24
      ENABLE_RDP: "1"
      ENABLE_WEB: "1"
      # --- tuning (semua opsional) ---
      CHROMIUM_RENDERER_LIMIT: "3"
      CHROMIUM_CACHE_SIZE: "268435456"
      CHROMIUM_LOW_RAM: "0"      # "1" untuk server 1 vCPU / RAM kecil
      VNC_SPEED: lan             # lan | fast | medium | slow
      VNC_POLL: "40"
      MALLOC_ARENA_MAX: "2"
      DEBUG: "0"
      # START_URL: https://www.google.com
      AUTO_REFRESH_SECONDS: "0"    # reload otomatis tiap N detik (0 = mati)
      # EXTRA_EXT_DIRS: /path/ke/extension/lain
    # Chromium butuh /dev/shm yang lega
    shm_size: 1gb
    volumes:
      - browser-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  browser-data:
