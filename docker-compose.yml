services:
  browser:
    build:
      context: .
    image: railway-chromium-browser
    container_name: chromium-browser
    ports:
      - "3389:3389"   # RDP
      - "8080:8080"   # Web / noVNC
    environment:
      BROWSER_PASSWORD: root
      RDP_PASSWORD: root
      RDP_USER: root
      HTTP_PORT: "8080"
      RDP_PORT: "3389"
      SCREEN: 1600x900x24
      ENABLE_RDP: "1"
      ENABLE_WEB: "1"
      # START_URL: https://www.google.com
    # Chromium butuh /dev/shm yang lega
    shm_size: 1gb
    volumes:
      - browser-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  browser-data:
