<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto Refresh</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 274px; margin: 0; padding: 14px 16px 16px;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { margin: 0 0 12px; opacity: .65; font-size: 11.5px; word-break: break-all; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 10px 0 5px; }
  input[type=number] {
    width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px;
    border: 1px solid #c9ccd6; background: transparent; color: inherit;
  }
  .row { display: flex; gap: 9px; }
  .row > * { flex: 1; }
  button {
    width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border: 0; border-radius: 8px;
    cursor: pointer; color: #fff; background: #2f6fed;
  }
  button.ghost { background: #5a6270; }
  button:active { transform: translateY(1px); }
  .status { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(47,111,237,.12); font-size: 12px; }
  .hint { margin-top: 10px; font-size: 11px; opacity: .6; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Auto Refresh</h1>
  <p class="sub" id="url">memuat…</p>

  <label for="tab">Tab ini (detik, 0 = mati)</label>
  <div class="row">
    <input id="tab" type="number" min="0" max="86400" step="1" placeholder="0">
    <button id="setTab" style="flex:0 0 76px">Set</button>
  </div>

  <label for="glob">Semua tab (detik, 0 = mati)</label>
  <div class="row">
    <input id="glob" type="number" min="0" max="86400" step="1" placeholder="0">
    <button id="setGlob" style="flex:0 0 76px">Set</button>
  </div>

  <div class="row" style="margin-top:12px">
    <button id="pause" class="ghost">Pause</button>
    <button id="now" class="ghost">Reload now</button>
  </div>

  <div class="status" id="status">Siap.</div>
  <p class="hint">Minimal 5 detik. Pengaturan global bisa dipaksa oleh admin lewat env <code>AUTO_REFRESH_SECONDS</code>.</p>

  <script src="popup.js"></script>
</body>
</html>
