<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #23273a 0%, #14161f 55%, #0b0c11 100%);
    color: #e6e8f0; padding: 24px;
  }
  .card {
    width: 100%; max-width: 430px; background: rgba(24, 27, 38, .92);
    border: 1px solid #2c3040; border-radius: 18px; padding: 32px 28px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .logo {
    width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 50%;
    background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0);
    position: relative; box-shadow: 0 8px 24px rgba(66,133,244,.35);
  }
  .logo::after {
    content: ""; position: absolute; inset: 16px; border-radius: 50%; background: #181b26;
  }
  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 650; text-align: center; letter-spacing: .2px; }
  p.sub { margin: 0 0 24px; text-align: center; color: #9aa2b8; font-size: 13.5px; line-height: 1.5; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a9; margin-bottom: 8px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px;
    border: 1px solid #333a4d; background: #10131c; color: #e6e8f0; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #4285f4; box-shadow: 0 0 0 3px rgba(66,133,244,.18); }
  button {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 15px; font-weight: 600;
    border: 0; border-radius: 11px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #4285f4, #2563eb);
    transition: transform .12s, filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  .hint { margin-top: 18px; font-size: 12px; color: #78809a; text-align: center; line-height: 1.6; }
  .hint code { color: #b9c2d8; background: #10131c; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="logo" aria-hidden="true"></div>
    <h1>Chromium Browser</h1>
    <p class="sub">Remote browser · dijalankan di server, dibuka di tab ini.</p>

    <label for="pw">Password</label>
    <input id="pw" type="password" name="pw" autocomplete="current-password" placeholder="••••••••" autofocus>

    <button type="submit">Buka Browser</button>

    <p class="hint">
      Password diatur lewat variable <code>BROWSER_PASSWORD</code>.<br>
      Kalau belum diubah, passwordnya <code>root</code>.
    </p>
  </form>

<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var q = new URLSearchParams({
      autoconnect: '1',
      resize: 'scale',
      reconnect: '1',
      reconnect_delay: '1500',
      password: pw
    });
    window.location.href = 'vnc.html?' + q.toString();
  });
</script>
</body>
</html>
