<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #23273a 0%, #14161f 55%, #0b0c11 100%);
    color: #e6e8f0; padding: 24px; text-align: center;
  }
  .wrap { max-width: 460px; }
  .logo {
    width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 50%;
    background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0);
    position: relative; box-shadow: 0 10px 30px rgba(66,133,244,.4);
  }
  .logo::after { content: ""; position: absolute; inset: 19px; border-radius: 50%; background: #14161f; }
  h1 { margin: 0 0 8px; font-size: 23px; font-weight: 650; letter-spacing: .2px; }
  p { margin: 0 0 26px; color: #9aa2b8; font-size: 14px; line-height: 1.6; }
  a.go {
    display: inline-block; text-decoration: none; padding: 14px 40px; font-size: 15px; font-weight: 600;
    border-radius: 11px; color: #fff; background: linear-gradient(135deg, #4285f4, #2563eb);
    box-shadow: 0 10px 26px rgba(37,99,235,.35); transition: transform .12s, filter .15s;
  }
  a.go:hover { filter: brightness(1.08); }
  a.go:active { transform: translateY(1px); }
  .note { margin-top: 26px; font-size: 12px; color: #6f7790; line-height: 1.7; }
  .note code { color: #aab3c8; background: #10131c; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true"></div>
    <h1>Chromium Browser</h1>
    <p>Remote browser siap dipakai — tanpa login, tanpa password.</p>
    <a class="go" id="go" href="vnc.html?autoconnect=1&amp;resize=scale&amp;reconnect=1&amp;reconnect_delay=1500">Buka Browser</a>
    <p class="note">
      Kalau halaman ini terbuka atas permintaan admin, lanjut saja.<br>
      Kunci akses opsional: <code>/?token=RAHASIA</code>
    </p>
  </div>

<script>
  // noVNC tidak punya parameter "token" sendiri: token websockify harus
  // ditempel di path WebSocket, mis. websockify?token=RAHASIA.
  // Path disimpan di localStorage supaya tidak ikut terlihat di URL.
  (function () {
    var p = new URLSearchParams(location.search);
    var t = p.get('token');
    if (t) { try { localStorage.setItem('ws_token', t); } catch (e) {} }

    var stored = null;
    try { stored = localStorage.getItem('ws_token'); } catch (e) {}

    if (stored) {
      try { localStorage.setItem('path', 'websockify?token=' + encodeURIComponent(stored)); } catch (e) {}
    } else {
      try { localStorage.removeItem('path'); } catch (e) {}
    }

    var go = document.getElementById('go');
    var href = 'vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=1500';
    if (stored) { href += '&path=' + encodeURIComponent('websockify?token=' + stored); }
    go.href = href;

    if (p.get('auto') === '1') { location.replace(href); }
  })();
</script>
</body>
</html>
